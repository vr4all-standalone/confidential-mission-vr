<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <!-- hotd2-vr: added in 2026 for Confidential Mission VR. The readme's banner, drawn from plain shapes. -->
  <defs>
    <radialGradient id="glow" cx="1180" cy="280" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a99bff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#a99bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a99bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#151923" stroke-width="2"/>
    </pattern>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#d9f36c" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9f36c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="560" fill="#0b0d12"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <rect width="1600" height="560" fill="url(#glow)"/>
  <rect x="1" y="1" width="1598" height="558" rx="28" fill="none" stroke="#343947" stroke-width="2"/>

  <!-- the sight -->
  <g transform="translate(1180 280)" fill="none" stroke-linecap="round">
    <circle r="190" stroke="#343947" stroke-width="2"/>
    <circle r="150" stroke="#a99bff" stroke-width="3" stroke-dasharray="6 14" opacity="0.8"/>
    <circle r="96" stroke="#d9f36c" stroke-width="6"/>
    <circle r="9" fill="#d9f36c" stroke="none"/>
    <path d="M0 -230V-118M0 118V230M-230 0H-118M118 0H230" stroke="#d9f36c" stroke-width="6"/>
    <path d="M-150 -150l22 22M150 -150l-22 22M-150 150l22 -22M150 150l-22 -22" stroke="#9ba5b4" stroke-width="3"/>
  </g>

  <!-- the gun and its laser -->
  <path d="M566 402L1172 276" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(470 432) rotate(-12)">
    <rect x="0" y="-26" width="150" height="40" rx="10" fill="#f8f5ef"/>
    <rect x="140" y="-18" width="32" height="18" rx="4" fill="#f8f5ef"/>
    <rect x="18" y="-36" width="90" height="12" rx="6" fill="#9ba5b4"/>
    <path d="M14 10h58l-12 86c-1 8-7 12-14 12H20c-8 0-13-6-12-14z" fill="#f8f5ef"/>
    <path d="M70 12c14 0 22 14 18 30l-6 4c3-14-3-24-14-24z" fill="#9ba5b4"/>
    <rect x="30" y="-16" width="70" height="6" rx="3" fill="#0b0d12" opacity="0.35"/>
  </g>

  <!-- the title -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="96" y="84" width="356" height="40" rx="20" fill="#151923" stroke="#343947" stroke-width="2"/>
    <circle cx="122" cy="104" r="7" fill="#d9f36c"/>
    <text x="140" y="111" fill="#9ba5b4" font-size="19" font-weight="700" letter-spacing="3">SEGA NAOMI · 2000 · LIGHT GUN</text>
    <text x="92" y="214" fill="#f8f5ef" font-size="86" font-weight="800" letter-spacing="1">CONFIDENTIAL</text>
    <text x="92" y="306" fill="#f8f5ef" font-size="86" font-weight="800" letter-spacing="1">MISSION</text>
    <rect x="520" y="236" width="128" height="80" rx="18" fill="#d9f36c"/>
    <text x="584" y="304" fill="#0b0d12" font-size="66" font-weight="900" text-anchor="middle">VR</text>
    <text x="96" y="364" fill="#9ba5b4" font-size="28" font-weight="600">Standalone Meta Quest · PC VR</text>
  </g>

  <!-- the file stamp -->
  <g transform="translate(1440 470) rotate(-8)" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="-118" y="-30" width="236" height="56" rx="8" fill="none" stroke="#a99bff" stroke-width="4"/>
    <text x="0" y="10" fill="#a99bff" font-size="28" font-weight="800" letter-spacing="6" text-anchor="middle">CLASSIFIED</text>
  </g>
</svg>
